name: Update Lotto Data

on:
  schedule:
    # 매주 토요일 밤 10시 (한국시간) = UTC 13:00
    - cron: '0 13 * * 6'
  workflow_dispatch: # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest lotto data and update
        run: |
          python << 'EOF'
          import requests
          import re
          import time

          # 브라우저처럼 요청하기 위한 헤더
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/javascript, */*; q=0.01',
              'Accept-Language': 'ko-KR,ko;q=0.9,en-US;q=0.8,en;q=0.7',
              'Referer': 'https://www.dhlottery.co.kr/',
          }

          def fetch_lotto_data(round_num):
              url = f'https://www.dhlottery.co.kr/common.do?method=getLottoNumber&drwNo={round_num}'
              try:
                  response = requests.get(url, headers=headers, timeout=10)
                  return response.json()
              except Exception as e:
                  print(f'Error fetching round {round_num}: {e}')
                  return None

          # index.html 읽기
          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          # 현재 내장된 마지막 회차 찾기
          match = re.search(r'\[(\d+),\[\d+,\d+,\d+,\d+,\d+,\d+\],\d+\]\];', html)
          if not match:
              print('Cannot find LOTTO_DATA in index.html')
              exit(0)

          last_round = int(match.group(1))
          print(f'Current last round: {last_round}')

          new_data = []
          current_round = last_round + 1

          # 새 회차 데이터 가져오기
          while True:
              data = fetch_lotto_data(current_round)

              if not data or data.get('returnValue') != 'success':
                  print(f'Round {current_round} not available yet')
                  break

              numbers = sorted([
                  data['drwtNo1'], data['drwtNo2'], data['drwtNo3'],
                  data['drwtNo4'], data['drwtNo5'], data['drwtNo6']
              ])
              bonus = data['bnusNo']

              entry = f"[{data['drwNo']},[{','.join(map(str, numbers))}],{bonus}]"
              new_data.append(entry)

              print(f"Added round {current_round}: {numbers} + {bonus}")
              current_round += 1

              # API 부하 방지
              time.sleep(1)

          if not new_data:
              print('No new data to add')
              exit(0)

          # index.html 업데이트
          insert_point = html.rfind(']];')
          new_html = html[:insert_point] + ',' + ','.join(new_data) + html[insert_point:]

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(new_html)

          print(f'Successfully added {len(new_data)} new round(s)')
          EOF

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update: Add latest lotto data $(date +'%Y-%m-%d')"
          git push
